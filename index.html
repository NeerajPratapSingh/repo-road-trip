<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repo Village</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Start screen -->
  <div id="start" class="overlay">
    <div class="card">
      <div class="logo">🍂 REPO VILLAGE</div>
      <p class="sub">A cozy little town where every shop is one of your projects. Wander in and <span>chat</span> with them.</p>
      <div class="row">
        <input id="username" type="text" placeholder="github username — e.g. torvalds" autocomplete="off" />
        <button id="startBtn">Enter the village</button>
      </div>
      <div id="loading" class="loading">Opening the shops…</div>
      <div id="startError" class="error"></div>
      <p class="hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk · <kbd>E</kbd> talk · <kbd>Esc</kbd> leave</p>
    </div>
  </div>

  <!-- HUD proximity prompt -->
  <div id="prompt" class="prompt hidden"></div>

  <!-- Chat panel -->
  <div id="chat" class="chat hidden">
    <div class="chat-head">
      <div>
        <div id="chatTitle" class="chat-title">repo</div>
        <div id="chatMeta" class="chat-meta"></div>
      </div>
      <button id="chatClose" title="Close (Esc)">✕</button>
    </div>
    <div id="chatLog" class="chat-log"></div>
    <div id="chatChips" class="chips"></div>
    <div class="chat-input">
      <input id="chatInput" type="text" placeholder="Ask this project anything…" autocomplete="off" />
      <button id="chatSend">➤</button>
    </div>
  </div>

  <script src="https://unpkg.com/kaplay@3001.0.19/dist/kaplay.js"></script>
  <script type="module" src="game2d.js"></script>
</body>
</html>
