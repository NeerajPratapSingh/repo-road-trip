<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub City</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud" class="hud hidden">
    <div class="hud-title"><span id="hudOwner">@user</span>'s City</div>
    <div class="hud-sub" id="hudSub"></div>
  </div>
  <div id="legend" class="legend hidden"></div>
  <div id="hint" class="hint-bar hidden">drag to orbit · scroll to zoom · <b>click a tower</b></div>
  <div id="tooltip" class="tooltip hidden"></div>

  <!-- Start screen -->
  <div id="start" class="overlay">
    <div class="card">
      <div class="logo">▞ GITHUB CITY</div>
      <p class="sub">Every repo becomes a tower in a neon skyline — the more stars, the taller it stands. Fly through and <span>click a building</span> to look inside.</p>
      <div class="row">
        <input id="username" type="text" placeholder="github username — e.g. torvalds" autocomplete="off" />
        <button id="startBtn">Build the city</button>
      </div>
      <div id="loading" class="loading">Raising the skyline…</div>
      <div id="startError" class="error"></div>
    </div>
  </div>

  <!-- Building panel: chat + files -->
  <div id="chat" class="chat hidden">
    <div class="chat-head">
      <div>
        <div id="chatTitle" class="chat-title">repo</div>
        <div id="chatMeta" class="chat-meta"></div>
      </div>
      <button id="chatClose" title="Close (Esc)">✕</button>
    </div>
    <div id="chatTabs" class="tabs">
      <button id="tabChat" class="tab active">💬 Chat</button>
      <button id="tabFiles" class="tab">📁 Files</button>
    </div>
    <div id="chatView">
      <div id="chatLog" class="chat-log"></div>
      <div id="chatChips" class="chips"></div>
      <div id="chatInputRow" class="chat-input">
        <input id="chatInput" type="text" placeholder="Ask this project anything…" autocomplete="off" />
        <button id="chatSend">➤</button>
      </div>
    </div>
    <div id="filesView" class="files-view hidden"></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="city.js"></script>
</body>
</html>
